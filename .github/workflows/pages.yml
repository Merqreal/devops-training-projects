name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/project_metadata.py --write
      - name: Reject stale generated catalog
        run: git diff --exit-code -- docs/projects/index.md
      - run: python -m unittest discover -s tests
      - run: python scripts/project_metadata.py
      - run: zensical build --strict
      - run: python scripts/validate_docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated documentation
        id: deployment
        uses: actions/deploy-pages@v4
